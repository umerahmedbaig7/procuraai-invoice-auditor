[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procuraai"
version = "0.1.0"
description = "ProcuraAI: LLM-assisted invoice and procurement compliance auditor (synthetic-data prototype)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "pydantic>=2.5", "pymupdf>=1.24", "Pillow>=10.0", "pytesseract>=0.3.10",
  "openpyxl>=3.1", "reportlab>=4.0", "rapidfuzz>=3.5", "numpy>=1.26", "scikit-learn>=1.3",
  "faiss-cpu>=1.7.4", "langgraph>=0.2", "fastapi>=0.110", "uvicorn>=0.27", "sqlalchemy>=2.0",
  "python-multipart>=0.0.9", "httpx>=0.26", "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0"]
embeddings = ["sentence-transformers>=2.7"]
ui = ["streamlit>=1.32"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

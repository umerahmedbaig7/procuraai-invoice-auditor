services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}        # optional; read from your shell / .env, never baked into the image
      - PROCURAAI_API_KEY=${PROCURAAI_API_KEY:-}
    volumes: ["procura_data:/data"]
  dashboard:
    build: .
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes: ["procura_data:/data"]
    depends_on: [api]
volumes:
  procura_data:
